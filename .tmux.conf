#don't use <Esc> as meta key
set -s escape-time 0

#extended keys for pi
set -g extended-keys on
set -g extended-keys-format csi-u

#reload tmux
bind r source-file ~/.tmux.conf

#set window start index to 1
set -g base-index 1

#colors
set-option -g status-position top
set -gu 'status-format[1]'
set -g status 1
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

#status bar theme
set -g @tmux2k-theme 'catppuccin-latte'
set -g @tmux2k-left-plugins 'session'
set -g @tmux2k-right-plugins " "

#clipboard
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

#vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

#--
#multi-key prefix for custom bindings
# bind-key -Troot C-b switch-client -TLeader
# bind -TLeader % split-window -h -p 40 -c "#{pane_current_path}"
# https://dub.sh/wZsQ96E and https://dub.sh/JxP9mhk
#--

#open in current directory 
bind '"' split-window -c "#{pane_current_path}"
#❗disable macos input-source shortcut to get below working https://shorturl.at/fe5FD
bind C-Space split-window -l 30% -c "#{pane_current_path}" 
bind Space split-window -h -l 40% -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

#session resurrecion with vim-obsession & restore contents
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

#list of plugins
#TODO: switch back to '2kabhishek/tmux2k' after PR #101 is merged
set -g @plugin 'megaconfidence/tmux2k#feature/catppuccin-flavors'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

#initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
