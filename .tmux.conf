#don't use <Esc> as meta key
set -s escape-time 0

#extended keys for pi
set -g extended-keys on
set -g extended-keys-format csi-u

#reload tmux
bind r source-file ~/.tmux.conf

#set window and pane start index to 1, close gaps when windows close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

#scrollback, focus events for nvim, switch session instead of detaching
set -g history-limit 50000
set -g focus-events on
set -g detach-on-destroy off

#show the running program as the window name; fall back to the
#directory basename when the shell is idle so it isn't just "zsh"
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{b:pane_current_command},zsh},#{b:pane_current_path},#{b:pane_current_command}}"

#colors
set-option -g status-position top
set -gu 'status-format[1]'
set -g status on
set -g default-terminal "tmux-256color"

#status bar theme
set -g @tmux2k-theme 'catppuccin-latte'
set -g @tmux2k-left-plugins 'session'
set -g @tmux2k-right-plugins " "
#rounded end after the session block, matching the window list (nerd font U+E0B4)
set -g @tmux2k-left-sep "\uE0B4"

#clipboard
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

#vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

#--
#multi-key prefix for custom bindings
# bind-key -Troot C-b switch-client -TLeader
# bind -TLeader % split-window -h -p 40 -c "#{pane_current_path}"
# https://dub.sh/wZsQ96E and https://dub.sh/JxP9mhk
#--

#open in current directory 
bind '"' split-window -c "#{pane_current_path}"
#❗disable macos input-source shortcut to get below working https://shorturl.at/fe5FD
bind C-Space split-window -l 30% -c "#{pane_current_path}" 
bind Space split-window -h -l 40% -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

#session resurrecion with vim-obsession & restore contents
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
#vibe renames its process to "Vibe CLI", so map it back to a runnable command
set -g @resurrect-processes '"~Vibe CLI->vibe -c"'

#list of plugins
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

#initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

#window status — `window-status-separator ""` closes the inter-window gap
#and must be set AFTER `run tpm` because the catppuccin plugin bakes the
#window-status-format during load.
set -g window-status-separator ""
